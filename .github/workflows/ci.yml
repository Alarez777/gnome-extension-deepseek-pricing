name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-shells:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        girs-shell:
          - '48.0.4'
          - '49.1.0'
          - '50.0.4'
          - '51.0.1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type check against GNOME Shell ${{ matrix.girs-shell }}
        run: |
          npm install --no-save --no-audit --no-fund \
            "@girs/gnome-shell@${{ matrix.girs-shell }}"
          npm run typecheck

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libglib2.0-bin

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build extension package
        run: make pack

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-pricing
          path: deepseek-pricing.zip
